name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/example/myandroidbot
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "MyAndroidBot"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.myandroidbot"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.myandroidbot"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Мой AI Бот"
                  android:allowBackup="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#5555FF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/java/com/example/myandroidbot/MainActivity.kt <<'EOF'
          package com.example.myandroidbot

          import android.app.Activity
          import android.os.Bundle
          import android.speech.RecognizerIntent
          import android.content.Intent
          import android.widget.*
          import android.view.Gravity

          class MainActivity : Activity() {

              private val requestCode = 1001
              private lateinit var chat: TextView
              private lateinit var input: EditText

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(28, 40, 28, 28)
                  }

                  val title = TextView(this).apply {
                      text = "🤖 Мой AI Бот"
                      textSize = 28f
                      gravity = Gravity.CENTER
                  }

                  chat = TextView(this).apply {
                      text = "Бот готов. Напиши или скажи команду."
                      textSize = 18f
                      setPadding(8, 35, 8, 25)
                  }

                  input = EditText(this).apply {
                      hint = "Напиши команду..."
                      textSize = 18f
                  }

                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                  }

                  val send = Button(this).apply {
                      text = "Отправить"
                      setOnClickListener {
                          answer(input.text.toString())
                      }
                  }

                  val mic = Button(this).apply {
                      text = "🎤 Голос"
                      setOnClickListener {
                          startVoice()
                      }
                  }

                  row.addView(send, LinearLayout.LayoutParams(0, -2, 1f))
                  row.addView(mic, LinearLayout.LayoutParams(0, -2, 1f))

                  layout.addView(title)
                  layout.addView(chat, LinearLayout.LayoutParams(-1, 0, 1f))
                  layout.addView(input)
                  layout.addView(row)

                  setContentView(layout)
              }

              private fun startVoice() {
                  val intent = Intent(
                      RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                  ).apply {
                      putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                      )
                      putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          "ru-RU"
                      )
                      putExtra(
                          RecognizerIntent.EXTRA_PROMPT,
                          "Скажите команду"
                      )
                  }

                  startActivityForResult(intent, requestCode)
              }

              override fun onActivityResult(
                  requestCode: Int,
                  resultCode: Int,
                  data: Intent?
              ) {
                  super.onActivityResult(requestCode, resultCode, data)

                  if (requestCode == this.requestCode &&
                      resultCode == RESULT_OK) {

                      val text =
                          data?.getStringArrayListExtra(
                              RecognizerIntent.EXTRA_RESULTS
                          )?.firstOrNull() ?: return

                      input.setText(text)
                      answer(text)
                  }
              }

              private fun answer(command: String) {
                  if (command.isBlank()) return

                  chat.text =
                      "Ты: $command\n\n" +
                      "Бот: Команда получена. " +
                      "Следующий этап — подключение AI."

                  input.text.clear()
              }
          }
          EOF

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MyAndroidBot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
